name: Release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.12.0"

jobs:
  # Compute the next semantic version without publishing anything. The build
  # job needs the version before it can inject it via -ldflags, and the
  # release job needs to know whether there's anything to publish at all.
  version:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.sr.outputs.new_release_published }}
      version: ${{ steps.sr.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sr
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    if: needs.version.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-latest
            platform: linux/amd64
          - os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS (Windows installer packaging)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build GUI (Wails)
        shell: bash
        run: |
          EXTRA_FLAGS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_FLAGS="-nsis"
          fi
          wails build -platform ${{ matrix.platform }} -ldflags "-X main.version=v${APP_VERSION}" $EXTRA_FLAGS

      - name: Build momo-mcp CLI
        shell: bash
        env:
          CGO_ENABLED: "0" # pure stdio<->pipe tunnel, no cgo needed; keeps cross-arch macOS build simple
        run: |
          case "${{ runner.os }}" in
            Windows)
              go build -o build/bin/momo-mcp.exe ./cmd/momo-mcp
              ;;
            Linux)
              go build -o build/bin/momo-mcp ./cmd/momo-mcp
              ;;
            macOS)
              GOARCH=amd64 go build -o build/bin/momo-mcp-amd64 ./cmd/momo-mcp
              GOARCH=arm64 go build -o build/bin/momo-mcp-arm64 ./cmd/momo-mcp
              lipo -create -output build/bin/momo-mcp build/bin/momo-mcp-amd64 build/bin/momo-mcp-arm64
              ;;
          esac

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $ver = $env:APP_VERSION
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build\bin\MomoShell-amd64-installer.exe" "dist\MomoShell-v$ver-windows-amd64-installer.exe"
          Compress-Archive -Path "build\bin\MomoShell.exe","build\bin\momo-mcp.exe" -DestinationPath "dist\MomoShell-v$ver-windows-amd64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar czf "dist/MomoShell-v${APP_VERSION}-linux-amd64.tar.gz" -C build/bin MomoShell momo-mcp

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist pkgtmp/mac
          cp -R build/bin/MomoShell.app pkgtmp/mac/
          cp build/bin/momo-mcp pkgtmp/mac/
          (cd pkgtmp/mac && zip -r -y "$OLDPWD/dist/MomoShell-v${APP_VERSION}-darwin-universal.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/*

  release:
    needs: [version, build]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true # TEMP: safe first-run test, no real release. Revert to false to go live.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
